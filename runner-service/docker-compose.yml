services:
  runner:
    build: .
    image: pit-runner:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    # Defense in depth: read-only rootfs, scratch /tmp only, no extra caps.
    # Icarus emits vvp bytecode consumed by the vvp interpreter, so /tmp can
    # remain noexec. Public deployments should still isolate every submission
    # in its own sandbox/job (see README).
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped
